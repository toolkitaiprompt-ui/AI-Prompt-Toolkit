# Cloudflare Pages configuration for AI Prompt Toolkit
# Used for local preview (`npx wrangler pages dev dist/public`).
# Live deploys are driven by .github/workflows/deploy-cloudflare.yml.

name = "ai-prompt-toolkit"
compatibility_date = "2024-11-01"

# Build output directory (produced by `npm run build` + `node prerender.mjs`)
pages_build_output_dir = "dist/public"
