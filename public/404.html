<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#020617" />
    <title>Page Not Found | AI World Hub</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top, #162552 0%, #071225 42%, #020617 100%);
        color: #e2e8f0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(100%, 620px); text-align: center; }
      .brand { color: #fbbf24; font-weight: 800; letter-spacing: .02em; text-decoration: none; }
      .code { margin: 28px 0 8px; color: #fbbf24; font-size: clamp(4rem, 20vw, 9rem); font-weight: 900; line-height: 1; }
      h1 { margin: 0; color: #fff; font-size: clamp(1.8rem, 5vw, 2.75rem); }
      p { margin: 16px auto 28px; max-width: 530px; color: #cbd5e1; font-size: 1.05rem; line-height: 1.65; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      a.button { display: inline-block; border-radius: 10px; padding: 12px 18px; font-weight: 700; text-decoration: none; }
      .primary { background: #fbbf24; color: #111827; }
      .secondary { border: 1px solid #475569; color: #f8fafc; }
      a:focus-visible { outline: 3px solid #fbbf24; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="AI World Hub home">AI WORLD HUB</a>
      <div class="code" aria-hidden="true">404</div>
      <h1>Page not found</h1>
      <p>The page you requested does not exist, may have moved, or the address may be incorrect.</p>
      <nav class="actions" aria-label="Helpful links">
        <a class="button primary" href="/">Go to homepage</a>
        <a class="button secondary" href="/tools/">Browse free tools</a>
      </nav>
    </main>
  </body>
</html>
